<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="120" cy="25" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="60" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="680" cy="30" r="1" fill="white" opacity="0.4"/>
  <circle cx="740" cy="55" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="600" cy="20" r="1" fill="white" opacity="0.5"/>

  <!-- Sun glow -->
  <circle cx="640" cy="100" r="80" fill="#fbbf24" opacity="0.08" filter="url(#glow)"/>
  <circle cx="640" cy="100" r="55" fill="#fbbf24" opacity="0.12"/>
  <circle cx="640" cy="100" r="38" fill="url(#sunGrad)" opacity="0.9"/>

  <!-- Sun rays -->
  <g opacity="0.4" stroke="#fbbf24" stroke-width="2">
    <line x1="640" y1="50" x2="640" y2="35"/>
    <line x1="640" y1="150" x2="640" y2="165"/>
    <line x1="590" y1="100" x2="575" y2="100"/>
    <line x1="690" y1="100" x2="705" y2="100"/>
    <line x1="604" y1="64" x2="594" y2="54"/>
    <line x1="676" y1="136" x2="686" y2="146"/>
    <line x1="676" y1="64" x2="686" y2="54"/>
    <line x1="604" y1="136" x2="594" y2="146"/>
  </g>

  <!-- Energy flow lines -->
  <path d="M 640 138 Q 580 200 480 240" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="6 4"/>
  <path d="M 640 138 Q 620 200 560 250" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="6 4"/>

  <!-- Ground/Horizon -->
  <rect x="0" y="360" width="800" height="140" fill="#0f1c2e"/>

  <!-- City buildings (background) -->
  <rect x="30" y="290" width="40" height="80" fill="#1e3a5f" opacity="0.5" rx="2"/>
  <rect x="80" y="270" width="30" height="100" fill="#1e3a5f" opacity="0.4" rx="2"/>
  <rect x="710" y="300" width="35" height="70" fill="#1e3a5f" opacity="0.5" rx="2"/>
  <rect x="755" y="280" width="28" height="90" fill="#1e3a5f" opacity="0.4" rx="2"/>
  <!-- Building windows -->
  <rect x="38" y="300" width="7" height="7" fill="#fbbf24" opacity="0.3" rx="1"/>
  <rect x="52" y="300" width="7" height="7" fill="#fbbf24" opacity="0.2" rx="1"/>
  <rect x="38" y="315" width="7" height="7" fill="#fbbf24" opacity="0.4" rx="1"/>

  <!-- Main house structure -->
  <!-- House base -->
  <rect x="180" y="280" width="440" height="200" fill="#1e293b" rx="4"/>
  <!-- Roof -->
  <polygon points="155,280 400,140 645,280" fill="url(#roofGrad)"/>
  <!-- Roof ridge line -->
  <line x1="155" y1="280" x2="645" y2="280" stroke="#374151" stroke-width="2"/>

  <!-- Solar panels on roof - left side -->
  <g transform="skewY(-25) translate(200, 240)">
    <!-- Panel row 1 -->
    <rect x="0" y="0" width="52" height="34" fill="url(#panelGrad)" rx="2" stroke="#3b82f6" stroke-width="0.5"/>
    <rect x="58" y="0" width="52" height="34" fill="url(#panelGrad)" rx="2" stroke="#3b82f6" stroke-width="0.5"/>
    <rect x="116" y="0" width="52" height="34" fill="url(#panelGrad)" rx="2" stroke="#3b82f6" stroke-width="0.5"/>
    <!-- Panel row 2 -->
    <rect x="0" y="40" width="52" height="34" fill="url(#panelGrad)" rx="2" stroke="#3b82f6" stroke-width="0.5"/>
    <rect x="58" y="40" width="52" height="34" fill="url(#panelGrad)" rx="2" stroke="#3b82f6" stroke-width="0.5"/>
    <rect x="116" y="40" width="52" height="34" fill="url(#panelGrad)" rx="2" stroke="#3b82f6" stroke-width="0.5"/>
    <!-- Panel grid lines -->
    <line x1="26" y1="0" x2="26" y2="34" stroke="#60a5fa" stroke-width="0.3" opacity="0.5"/>
    <line x1="0" y1="17" x2="52" y2="17" stroke="#60a5fa" stroke-width="0.3" opacity="0.5"/>
    <line x1="84" y1="0" x2="84" y2="34" stroke="#60a5fa" stroke-width="0.3" opacity="0.5"/>
    <line x1="58" y1="17" x2="110" y2="17" stroke="#60a5fa" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!-- Glow from panels -->
  <ellipse cx="330" cy="235" rx="90" ry="15" fill="#3b82f6" opacity="0.1" filter="url(#glow)"/>

  <!-- House door -->
  <rect x="355" y="350" width="90" height="130" fill="#0f172a" rx="4"/>
  <rect x="360" y="355" width="38" height="80" fill="#1e293b" rx="2"/>
  <rect x="402" y="355" width="38" height="80" fill="#1e293b" rx="2"/>
  <circle cx="400" cy="400" r="4" fill="#fbbf24" opacity="0.7"/>

  <!-- Windows -->
  <rect x="215" y="310" width="80" height="60" fill="#1e3a5f" rx="3"/>
  <rect x="505" y="310" width="80" height="60" fill="#1e3a5f" rx="3"/>
  <!-- Window glow -->
  <rect x="217" y="312" width="78" height="58" fill="#fbbf24" opacity="0.08" rx="2"/>
  <rect x="507" y="312" width="78" height="58" fill="#fbbf24" opacity="0.08" rx="2"/>
  <!-- Window cross -->
  <line x1="255" y1="310" x2="255" y2="370" stroke="#374151" stroke-width="2"/>
  <line x1="215" y1="340" x2="295" y2="340" stroke="#374151" stroke-width="2"/>
  <line x1="545" y1="310" x2="545" y2="370" stroke="#374151" stroke-width="2"/>
  <line x1="505" y1="340" x2="585" y2="340" stroke="#374151" stroke-width="2"/>

  <!-- Power meter / inverter box -->
  <rect x="455" y="340" width="50" height="38" fill="#1e3a5f" rx="3" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="480" cy="356" r="6" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="480" cy="356" r="2" fill="#22c55e"/>

  <!-- Energy particles flowing down from panels -->
  <circle cx="310" cy="270" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="350" cy="285" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="290" cy="295" r="2.5" fill="#fbbf24" opacity="0.5"/>

  <!-- Smart meter label -->
  <rect x="620" y="300" width="130" height="55" fill="#0f172a" rx="8" stroke="#1e3a5f" stroke-width="1"/>
  <text x="685" y="320" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">GENERATION</text>
  <text x="685" y="340" text-anchor="middle" fill="#22c55e" font-size="18" font-weight="900">4.2 kW</text>
  <text x="685" y="352" text-anchor="middle" fill="#64748b" font-size="8">TODAY: 18.6 kWh</text>

  <!-- CO2 badge -->
  <rect x="30" y="300" width="110" height="48" fill="#0f172a" rx="8" stroke="#1e3a5f" stroke-width="1"/>
  <text x="85" y="318" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">CO₂ SAVED</text>
  <text x="85" y="337" text-anchor="middle" fill="#34d399" font-size="17" font-weight="900">12.4 kg</text>
  <text x="85" y="346" text-anchor="middle" fill="#64748b" font-size="8">this month</text>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="365" rx="240" ry="12" fill="#000" opacity="0.3"/>
</svg>
